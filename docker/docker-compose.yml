name: autowork

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:4000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-autowork}:${POSTGRES_PASSWORD:-autoworkpass}@postgres:5432/${POSTGRES_DB:-autowork_db}?schema=public}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - PCLOUD_DEFAULT_PROVIDER=${PCLOUD_DEFAULT_PROVIDER:-pcloud}
      - PCLOUD_ALLOW_MOCK=${PCLOUD_ALLOW_MOCK:-false}
      - PCLOUD_API_HOST=${PCLOUD_API_HOST:-https://api.pcloud.com}
      - PCLOUD_API_URL=${PCLOUD_API_URL:-https://api.pcloud.com}
      - PCLOUD_CREDENTIAL_ENCRYPTION_KEY=${PCLOUD_CREDENTIAL_ENCRYPTION_KEY:?PCLOUD_CREDENTIAL_ENCRYPTION_KEY must be set}
      - EMAIL_CREDENTIAL_ENCRYPTION_KEY=${EMAIL_CREDENTIAL_ENCRYPTION_KEY:?EMAIL_CREDENTIAL_ENCRYPTION_KEY must be set}
      - EMAIL_DEFAULT_PROVIDER=${EMAIL_DEFAULT_PROVIDER:-}
      - EMAIL_ALLOW_FAKE=${EMAIL_ALLOW_FAKE:-false}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REDIRECT_URI=${GMAIL_REDIRECT_URI:-http://localhost:4000/api/v1/email/accounts/gmail/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker-campaign:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-autowork}:${POSTGRES_PASSWORD:-autoworkpass}@postgres:5432/${POSTGRES_DB:-autowork_db}?schema=public}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PCLOUD_DEFAULT_PROVIDER=${PCLOUD_DEFAULT_PROVIDER:-pcloud}
      - PCLOUD_ALLOW_MOCK=${PCLOUD_ALLOW_MOCK:-false}
      - PCLOUD_API_HOST=${PCLOUD_API_HOST:-https://api.pcloud.com}
      - PCLOUD_API_URL=${PCLOUD_API_URL:-https://api.pcloud.com}
      - PCLOUD_CREDENTIAL_ENCRYPTION_KEY=${PCLOUD_CREDENTIAL_ENCRYPTION_KEY:?PCLOUD_CREDENTIAL_ENCRYPTION_KEY must be set}
      - EMAIL_CREDENTIAL_ENCRYPTION_KEY=${EMAIL_CREDENTIAL_ENCRYPTION_KEY:?EMAIL_CREDENTIAL_ENCRYPTION_KEY must be set}
    command: ["npx", "ts-node", "--transpile-only", "../workers/campaign.worker.entry.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  worker-pcloud:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-autowork}:${POSTGRES_PASSWORD:-autoworkpass}@postgres:5432/${POSTGRES_DB:-autowork_db}?schema=public}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PCLOUD_DEFAULT_PROVIDER=${PCLOUD_DEFAULT_PROVIDER:-pcloud}
      - PCLOUD_ALLOW_MOCK=${PCLOUD_ALLOW_MOCK:-false}
      - PCLOUD_API_HOST=${PCLOUD_API_HOST:-https://api.pcloud.com}
      - PCLOUD_API_URL=${PCLOUD_API_URL:-https://api.pcloud.com}
      - PCLOUD_CREDENTIAL_ENCRYPTION_KEY=${PCLOUD_CREDENTIAL_ENCRYPTION_KEY:?PCLOUD_CREDENTIAL_ENCRYPTION_KEY must be set}
      - EMAIL_CREDENTIAL_ENCRYPTION_KEY=${EMAIL_CREDENTIAL_ENCRYPTION_KEY:?EMAIL_CREDENTIAL_ENCRYPTION_KEY must be set}
    command: ["npx", "ts-node", "--transpile-only", "../workers/pcloud-share.worker.entry.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  worker-email:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-autowork}:${POSTGRES_PASSWORD:-autoworkpass}@postgres:5432/${POSTGRES_DB:-autowork_db}?schema=public}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PCLOUD_DEFAULT_PROVIDER=${PCLOUD_DEFAULT_PROVIDER:-pcloud}
      - PCLOUD_ALLOW_MOCK=${PCLOUD_ALLOW_MOCK:-false}
      - PCLOUD_API_HOST=${PCLOUD_API_HOST:-https://api.pcloud.com}
      - PCLOUD_API_URL=${PCLOUD_API_URL:-https://api.pcloud.com}
      - PCLOUD_CREDENTIAL_ENCRYPTION_KEY=${PCLOUD_CREDENTIAL_ENCRYPTION_KEY:?PCLOUD_CREDENTIAL_ENCRYPTION_KEY must be set}
      - EMAIL_CREDENTIAL_ENCRYPTION_KEY=${EMAIL_CREDENTIAL_ENCRYPTION_KEY:?EMAIL_CREDENTIAL_ENCRYPTION_KEY must be set}
    command: ["npx", "ts-node", "--transpile-only", "../workers/email-dispatch.worker.entry.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: autowork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autowork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoworkpass}
      POSTGRES_DB: ${POSTGRES_DB:-autowork_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - autowork_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-autowork} -d $${POSTGRES_DB:-autowork_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autowork-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - autowork_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  autowork_postgres_data:
  autowork_redis_data:
